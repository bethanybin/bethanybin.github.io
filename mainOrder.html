<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Poke Bar Berkeley Main</title>
    <script src="https://www.gstatic.com/firebasejs/5.3.1/firebase.js"></script>
    <link rel="stylesheet" href="index.css">
  </head>
  <body>
    <h2>Log Out</h2>

    <button id="logout">Log Out</button>
    <div id="size">
      <button id="small" class="sizeclass">Small</button>
      <button id="med" class="sizeclass">Medium</button>
      <button id="large" class="sizeclass">Large</button>
    </div>
    <div id="base">
      <button id="wrice" class="baseclass">White Rice</button>
      <button id="brice" class="baseclass">Brown Rice</button>
      <button id="spring" class="baseclass">Spring Mix</button>
    </div>
    <div id="sides">
      <button id="sea">Seaweed Salad</button>
      <button id="crab">Imitation Crab</button>
      <button id="fur">Furikake</button>
      <button id="mango">Mango</button>
      <button id="avo">Avocado</button>
    </div>
    <div id="protein">
      <button id="salmon">Salmon</button>
      <button id="tuna">Tuna</button>
      <button id="stuna">Spicy Tuna</button>
      <button id="alba">Albacore</button>
      <button id="shrimp">Shrimp</button>
      <button id="tofu">Tofu</button>
      <button id="scallop">Scallop</button>
      <button id="oct">Octopus</button>
    </div>
    <div id="veg">
      <button id="kale">Kale</button>
      <button id="cucumber">Cucumber</button>
      <button id="gonion">Green Onion</button>
      <button id="corn">Corn</button>
      <button id="jal">Jalapeno</button>
      <button id="sonion">Sweet Onion</button>
      <button id="pineapple">Pineapple</button>
      <button id="eda">Edamame</button>
      <button id="cil">Cilantro</button>
      <button id="was">Wasabi</button>
      <button id="ginger">Ginger</button>
      <button id="mas">Masago</button>
    </div>
    <div id="sauce">
      <button id="house">House</button>
      <button id="ponzu">Ponzu</button>
      <button id="chili">Sweet Chili</button>
      <button id="shoyu">Shoyu</button>
      <button id="wasmayo">Wasabi Mayo</button>
      <button id="smayo">Spicy Mayo</button>
    </div>
    <div id="drinks">
      <button id="water">Water/Sparkling Water</button>
      <button id="soda">Soda</button>
      <button id="sanpell">San Pellegrino</button>
      <button id="vitwater">Vitamin Water</button>
      <button id="organic">Organic Drink</button>
    </div>
    <div id="currOrder">
      <p id="currSize"></p1>
      <p id="currBase"></p1>
      <p id="currSides"></p1>
      <p id="currProtein"></p1>
      <p id="currVeg"></p1>
      <p id="currSauce"></p1>
      <p id="currDrinks"></p1>
    </div>
  </body>
  <script src="mainOrder.js"></script>
</html>
