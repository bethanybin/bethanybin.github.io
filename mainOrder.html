<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Poke Bar Berkeley Main</title>
    <script src="https://www.gstatic.com/firebasejs/5.3.1/firebase.js"></script>
    <link rel="stylesheet" href="index.css">
  </head>
  <body>
    <h2>Log Out</h2>

    <button id="logout">Log Out</button>
    <div id="size">
      <button id="small" class="sizeclass">Small</button>
      <button id="med" class="sizeclass">Medium</button>
      <button id="large" class="sizeclass">Large</button>
    </div>
    <div id="base">
      <button id="wrice" class="baseclass">White Rice</button>
      <button id="brice" class="baseclass">Brown Rice</button>
      <button id="spring" class="baseclass">Spring Mix</button>
    </div>
    <div id="sides">
      <button id="sea" class="sidesclass">Seaweed Salad</button>
      <button id="crab" class="sidesclass">Imitation Crab</button>
      <button id="fur" class="sidesclass">Furikake</button>
      <button id="mango" class="sidesclass">Mango</button>
      <button id="avo" class="sidesclass">Avocado</button>
    </div>
    <div id="protein">
      <button id="salmon" class="proteinclass">Salmon</button>
      <button id="tuna" class="proteinclass">Tuna</button>
      <button id="stuna" class="proteinclass">Spicy Tuna</button>
      <button id="alba" class="proteinclass">Albacore</button>
      <button id="shrimp" class="proteinclass">Shrimp</button>
      <button id="tofu" class="proteinclass">Tofu</button>
      <button id="scallop" class="proteinclass">Scallop</button>
      <button id="oct" class="proteinclass">Octopus</button>
    </div>
    <div id="veg">
      <button id="kale" class="vegclass">Kale</button>
      <button id="cucumber" class="vegclass">Cucumber</button>
      <button id="gonion" class="vegclass">Green Onion</button>
      <button id="corn" class="vegclass">Corn</button>
      <button id="jal" class="vegclass">Jalapeno</button>
      <button id="sonion" class="vegclass">Sweet Onion</button>
      <button id="pineapple" class="vegclass">Pineapple</button>
      <button id="eda" class="vegclass">Edamame</button>
      <button id="cil" class="vegclass">Cilantro</button>
      <button id="was" class="vegclass">Wasabi</button>
      <button id="ginger" class="vegclass">Ginger</button>
      <button id="mas" class="vegclass">Masago</button>
    </div>
    <div id="sauce">
      <button id="house" class="sauceclass">House</button>
      <button id="ponzu" class="sauceclass">Ponzu</button>
      <button id="chili" class="sauceclass">Sweet Chili</button>
      <button id="shoyu" class="sauceclass">Shoyu</button>
      <button id="wasmayo" class="sauceclass">Wasabi Mayo</button>
      <button id="smayo" class="sauceclass">Spicy Mayo</button>
    </div>
    <div id="drinks">
      <button id="water" class="drinksclass">Water/Sparkling Water</button>
      <button id="soda" class="drinksclass">Soda</button>
      <button id="sanpell" class="drinksclass">San Pellegrino</button>
      <button id="vitwater" class="drinksclass">Vitamin Water</button>
      <button id="organic" class="drinksclass">Organic Drink</button>
    </div>
    <div id="currOrder">
      <p id="currSize"></p1>
      <p id="currBase"></p1>
      <p id="currSides"></p1>
      <p id="currProtein"></p1>
      <p id="currVeg"></p1>
      <p id="currSauce"></p1>
      <p id="currDrinks"></p1>
    </div>
    <button id="addToCart">Add to Cart</button>
  </body>
  <script src="mainOrder.js"></script>
</html>
