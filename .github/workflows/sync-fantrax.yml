name: Sync Fantrax league

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: fantrax-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-fantrax.txt
      - name: Install Fantrax client
        run: python -m pip install -r scripts/requirements-fantrax.txt
      - name: Refresh Fantrax league snapshots
        id: fantrax
        continue-on-error: true
        env:
          FANTRAX_COOKIE: ${{ secrets.FANTRAX_COOKIE }}
        run: python scripts/sync_fantrax.py
      - name: Save safe sync results
        run: |
          if git diff --quiet -- data/fantasy; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fantasy
          git commit -m "Update Fantrax snapshot"

          # The branch may advance while this job is running. Rebase the
          # generated snapshot onto the latest master and retry if another
          # push wins the race between our fetch and push.
          for attempt in 1 2 3; do
            git fetch origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Push raced with another update; retrying ($attempt/3)."
          done

          echo "Unable to push the Fantrax snapshot after 3 attempts."
          exit 1
      - name: Report an unsuccessful sync
        if: steps.fantrax.outcome != 'success'
        run: |
          echo "The last successful snapshot is still live. Check the annotated sync error above."
          exit 1
