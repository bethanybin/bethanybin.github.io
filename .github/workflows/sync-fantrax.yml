name: Sync Fantrax league

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: fantrax-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-fantrax.txt
      - name: Install Fantrax client
        run: python -m pip install -r scripts/requirements-fantrax.txt
      - name: Refresh private league snapshot
        id: fantrax
        continue-on-error: true
        env:
          FANTRAX_COOKIE: ${{ secrets.FANTRAX_COOKIE }}
        run: python scripts/sync_fantrax.py
      - name: Save safe sync results
        run: |
          if git diff --quiet -- data/fantasy; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fantasy/private-league.json data/fantasy/sync-status.json
          git commit -m "Update Fantrax snapshot"
          git push
      - name: Report an unsuccessful sync
        if: steps.fantrax.outcome != 'success'
        run: |
          echo "The last successful snapshot is still live. Check the annotated sync error above."
          exit 1
